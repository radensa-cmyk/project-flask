<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ judul_hero }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>

<body>

  <header>
    <nav>
      <div class="logo">JAWIRR</div>
      <ul class="nav-links">
        <li><a href="#hero">Beranda</a></li>
        <li><a href="#features">Fitur</a></li>
        <li><a href="#footer">Kontak</a></li>
      </ul>
      <button id="tombol-mode">turu dek</button>
    </nav>
  </header>

  <!-- Hero Section -->
  <main>
    <section id="hero" class="hero">
      <div class="hero-text">
        <h1>{{ judul_hero }}</h1>
        <p>"{{ deskripsi_hero }}"</p>
        <a href="#features" class="cta-btn">sinau neh lurr</a>
      </div>
      <div class="hero-img">
        <img src="https://static.independent.co.uk/2024/10/30/12/Wireless-headphones.jpg" alt="DevBeats Headphone" />
      </div>
    </section>

    <!-- Fitur Section -->
    <section id="features" class="features">
      {% for fitur in fitur_list %}
      <article class="feature">
        <h3>{{ fitur.judul }}</h3>
        <p>{{ fitur.isi }}</p>
      </article>
      {% endfor %}
    </section>
  </main>

  <!-- Footer -->
  <footer id="footer">
    <p>© 2025 DevBeats. All rights reserved.</p>
  </footer>

  <!-- JavaScript -->
  <script>
    const tombolMode = document.querySelector("#tombol-mode");
    tombolMode.addEventListener("click", () => {
      document.body.classList.toggle("dark-mode");
      tombolMode.textContent = document.body.classList.contains("dark-mode") ? "turuu" : "tangii";
    });
  </script>
</body>

</html>
