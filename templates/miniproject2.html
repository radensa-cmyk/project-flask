<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buku Tamu Digital</title>
  <style>
    /* 🌌 Tema futuristik biru lembut */
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: #f1f5f9;
      margin: 0;
      padding: 30px;
      display: flex;
      justify-content: center;
    }

    .container {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
      width: 100%;
      max-width: 600px;
      padding: 30px;
      animation: fadeIn 0.7s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    h1 {
      text-align: center;
      font-size: 28px;
      color: #38bdf8;
      text-shadow: 0 0 20px rgba(56, 189, 248, 0.5);
      margin-bottom: 25px;
    }

    form label {
      display: block;
      margin-top: 15px;
      color: #a5f3fc;
      font-weight: 500;
    }

    input,
    textarea {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: none;
      margin-top: 8px;
      font-size: 15px;
      background: rgba(255, 255, 255, 0.1);
      color: #f8fafc;
      outline: none;
      transition: all 0.3s ease;
    }

    input:focus,
    textarea:focus {
      background: rgba(255, 255, 255, 0.2);
      box-shadow: 0 0 0 2px #38bdf8;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 12px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      background: linear-gradient(90deg, #F5AD18, #F5AD18);
      color: #a5f3fc;
      font-weight: 600;
      font-size: 16px;
      transition: all 0.3s ease;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(56, 189, 248, 0.3);
    }

    h2 {
      color: #a5f3fc;
      margin-top: 40px;
      border-bottom: 2px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 6px;
      font-size: 20px;
    }

    .pesan {
      background: rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 14px 18px;
      margin-top: 12px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      transition: transform 0.3s ease, background 0.3s ease;
    }

    .pesan:hover {
      transform: scale(1.02);
      background: rgba(255, 255, 255, 0.12);
    }

    .pesan strong {
      color: #38bdf8;
      font-size: 15px;
    }

    .pesan p {
      margin: 6px 0 0;
      color: #e2e8f0;
      font-size: 14px;
    }

    .kosong {
      text-align: center;
      color: #94a3b8;
      margin-top: 15px;
      font-style: italic;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>MASUKIN PESAN DISINI!</h1>

    <form method="POST" action="">
      <label for="nama">Nama:</label>
      <input type="text" id="nama" name="nama" required>

      <label for="pesan">Pesan:</label>
      <textarea id="pesan" name="pesan" rows="3" required></textarea>

      <button type="submit">Send</button>
    </form>

    <h2>Pesan yang Masuk:</h2>

    {% if semua_pesan %}
    {% for pesan in semua_pesan|reverse %}
    <div class="pesan">
      <strong>{{ pesan.nama }}</strong>
      <p>{{ pesan.pesan }}</p>
    </div>
    {% endfor %}
    {% else %}
    <p class="kosong">Belum ada pesan masuk</p>
    {% endif %}
  </div>
</body>

</html>
